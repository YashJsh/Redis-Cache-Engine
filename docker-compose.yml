services:
  db:
    image: postgres:17
    container_name: slow-api-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:6
    container_name: slow-api-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: